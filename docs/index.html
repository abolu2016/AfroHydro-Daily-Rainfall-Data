<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfroHydro-1 Daily Rainfall</title><style>body{font:16px system-ui,sans-serif;background:#f5f8fa;color:#142b3a;margin:0}main{max-width:1050px;margin:30px auto;padding:0 18px}header{margin-bottom:18px}img{width:100%;height:auto;background:white;border:1px solid #d5e1e8;border-radius:8px}a{color:#075d92}small{color:#556}</style></head><body><main><header><h1>AfroHydro-1 Daily Rainfall</h1><p>Latest operational precipitation analysis over Africa.</p><p id="date">Loading latest analysis date…</p></header><img id="map" src="latest.png" alt="Latest AfroHydro-1 precipitation analysis map"><p><a id="tiff" href="https://github.com/abolu2016/AfroHydro-Daily-Rainfall-Data">Download latest GeoTIFF</a> · <a href="https://github.com/abolu2016/AfroHydro-Daily-Rainfall-Data">Browse all daily data</a></p><small>The map is a visualization; download the GeoTIFF for scientific analysis. Daily production is subject to operational availability.</small></main><script>fetch('map_metadata.json?ts='+Date.now()).then(r=>r.json()).then(m=>{document.getElementById('date').textContent='Analysis date: '+m.date;document.getElementById('map').src='latest.png?date='+encodeURIComponent(m.date);const [y,mo]=m.date.split('-');document.getElementById('tiff').href='https://github.com/abolu2016/AfroHydro-Daily-Rainfall-Data/raw/refs/heads/main/data/'+y+'/'+mo+'/'+encodeURIComponent(m.filename)}).catch(()=>{document.getElementById('date').textContent='Map metadata temporarily unavailable.'});</script></body></html>
