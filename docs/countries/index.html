<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AfroHydro | Country rainfall</title><style>body{font:16px system-ui,sans-serif;margin:0;background:#f5f7fa;color:#1c2938}header{background:#103a59;color:white;padding:30px max(22px,calc((100% - 1100px)/2))}main{max-width:1100px;margin:30px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px}.card{background:white;border:1px solid #dae2e8;border-radius:12px;padding:18px}.card img{width:100%;height:auto;background:#fff}a{color:#086caa}small{color:#526375}</style></head><body><header><h1>AfroHydro — Country rainfall</h1><p>Daily rainfall estimates extracted from the AfroHydro continental analysis</p></header><main><p><a href="../">← Africa-wide portal</a></p><div class="grid" id="grid"></div><p><small>GeoTIFFs are national subsets of the continental analysis; no additional country-specific assimilation is performed.</small></p></main><script>const countries=[['Nigeria','nigeria'],['Kenya','kenya'],['South Africa','south-africa'],['Ghana','ghana']];const grid=document.getElementById('grid');for(const [name,slug] of countries){const el=document.createElement('section');el.className='card';el.innerHTML=`<h2>${name}</h2><img src="${slug}/latest.png?v=${Date.now()}" alt="Latest rainfall map for ${name}"><p id="date-${slug}">Loading analysis date…</p><p><a id="download-${slug}" href="#">Download latest GeoTIFF</a></p>`;grid.appendChild(el);fetch(`${slug}/metadata.json?t=${Date.now()}`).then(r=>{if(!r.ok)throw Error('No metadata');return r.json()}).then(m=>{document.getElementById(`date-${slug}`).textContent=`Analysis date: ${m.date}`;const a=document.getElementById(`download-${slug}`);a.href=new URL('../'+ '../'+m.path, location.href).href;a.setAttribute('download','')}).catch(()=>{document.getElementById(`date-${slug}`).textContent='Map not yet published';document.getElementById(`download-${slug}`).style.display='none'})}</script></body></html>
